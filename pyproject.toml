[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dinndex"
version = "0.1.0"
description = "Your dinner history, indexed. Local archive ingestion."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "Pillow>=10,<14"]

[project.scripts]
dinndex = "dinndex.cli:main"

[tool.setuptools.packages.find]
include = ["dinndex*"]

[tool.setuptools.package-data]
dinndex = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
